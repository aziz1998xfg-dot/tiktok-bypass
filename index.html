<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُعالج التيك توك التلقائي</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-3xl font-bold text-indigo-400 mb-2">معالج تيك توك المؤتمت 🤖</h1>
        <p class="text-gray-400 text-sm mb-6">فقط **الِصق رابط الفيديو**، وسيبدأ فك الحقوق والتحميل تلقائياً.</p>

        <div class="mb-4">
            <input type="text" id="videoUrl" placeholder="الِصق رابط تيك توك هنا..." 
                   class="w-full p-4 rounded-xl bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg">
        </div>

        <div id="statusBox" class="hidden mt-6 p-4 bg-gray-900 rounded-xl border border-indigo-500/30">
            <div id="spinner" class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-400 mx-auto mb-3"></div>
            <p id="statusText" class="text-indigo-300 text-sm">في انتظار الرابط...</p>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('videoUrl');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');

        urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            if (url.startsWith('http://') || url.startsWith('https://')) {
                processVideoAutomatically(url);
            }
        });

        async function processVideoAutomatically(url) {
            urlInput.disabled = true;
            statusBox.classList.remove('hidden');
            spinner.classList.remove('hidden');
            statusText.innerText = "🚀 جاري فك البصمة الرقمية وإزالة حقوق الفيديو...";

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (response.ok) {
                    statusText.innerText = "✨ تم التعديل! جاري بدء التحميل التلقائي لجهازك...";
                    spinner.classList.add('hidden');
                    
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.href = data.download_url;
                    downloadAnchor.download = "tiktok_ready.mp4";
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    document.body.removeChild(downloadAnchor);

                    setTimeout(() => { resetForm(); }, 3000);
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError("حدث خطأ في السيرفر المحلي.");
            }
        }

        function showError(message) {
            spinner.classList.add('hidden');
            statusText.innerHTML = `<span class="text-red-400 font-bold">❌ خطأ: ${message}</span>`;
            setTimeout(() => { resetForm(); }, 4000);
        }

        function resetForm() {
            urlInput.disabled = false;
            urlInput.value = '';
            statusBox.classList.add('hidden');
        }
    </script>
</body>
</html>
